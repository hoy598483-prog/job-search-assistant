name: JD evaluation tests
on:
  push:
    branches: [master, "feat/**"]
  pull_request:
jobs:
  python-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline regression suite
        run: python -m unittest -v evaluations.test_agent_benchmark evaluations.test_real_corpus test_extract_job test_companion
      - name: Deterministic benchmark
        run: python -m evaluations.agent_benchmark --baseline
  node-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Workspace UI regression
        run: node tests/direction_ui.cjs
