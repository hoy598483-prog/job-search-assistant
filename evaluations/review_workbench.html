<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JD Annotation Review</title><link rel="stylesheet" href="/review_workbench.css"></head><body><header><h1>JD Annotation Review</h1><p>真实职位 · AI 初步标注 · 人工核验 Gold Labels</p><p id="summary" role="status">正在载入...</p></header><main><aside aria-label="职位列表"><h2>职位</h2><div id="cases"></div></aside><article><div id="current" class="heading"></div><section><h2>来源正文</h2><p class="hint">如果来源只有职位链接，请在 Indeed 打开页面，将 JD 正文粘贴到下方并点击「保存原文」。只保存有权使用的文本，不要包含账户资料。</p><label for="source">待审核 JD 正文</label><textarea id="source" rows="12" spellcheck="false" placeholder="在此粘贴完整职位描述"></textarea><div class="actions"><button id="save-source">保存当前 JD 原文</button><a id="source-link" target="_blank" rel="noopener noreferrer">打开原始招聘页</a></div></section><section><h2>AI 草稿（不等于 Gold Label）</h2><div class="actions"><button id="suggest-baseline">规则预标注</button><button id="suggest-codex">Codex 预标注（需确认发送）</button></div><p id="seed-notes" class="hint"></p><p class="hint">AI 建议可能遗漏条件；正式 Test Set 建议额外做一次独立审核。</p><div id="suggestions"></div></section><section><h2>人工可编辑标注</h2><div id="items"></div><button id="add">＋ 添加遗漏要求</button><label for="note">审核备注</label><textarea id="note" rows="3" maxlength="2000"></textarea><div class="actions"><button id="save">保存草稿</button><button id="review" class="primary">逐项检查后确认完整</button></div></section><section><h2>导出</h2><p>只导出已人工确认的职位，不自动把 AI 建议写成标准答案。</p><button id="export">导出 Reviewed Gold Dataset</button></section><p id="notice" role="status" aria-live="polite"></p></article></main><script src="/review_workbench.js" defer></script></body></html>
