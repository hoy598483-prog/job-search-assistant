<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人背景</title><link rel="stylesheet" href="design.css"><body><main>
<h1>个人背景</h1><p>独立于岗位方向管理；本人确认后，可供所有方向和计划使用。</p>
<section><button id="background-connect">连接 Codex 并检查登录</button><button id="background-login">启动 Codex 官方登录</button><p id="background-connection" role="status">尚未连接</p></section>
<section><h2>全局个人背景 · 所有方向共用</h2><p>粘贴你本人的自述或上传简历，文本先预览，PDF可查看原始页面，再交给Codex分析。确认后的背景供所有方向和计划使用；原文不会自动附带到后续聊天。</p><label>上传简历<input id="background-file" type="file" accept=".txt,.md,.pdf,.docx"></label><small>支持 TXT、Markdown、PDF 和 DOCX，最大2MB。PDF最多10页，原始页面图片由Codex识读，支持扫描简历；不依赖PDF文字层。</small><label>本人提供的原文 / 简历提取预览<textarea id="background-source" maxlength="60000" placeholder="可先删除电话、地址、身份证号等无关信息"></textarea></label><button id="background-analyze">交给 Codex 分析背景</button><label>背景草案（请核对并修正）<textarea id="background-draft" maxlength="6000"></textarea></label><button id="background-adopt">确认保存为全局背景</button><button id="background-remove">清除全局背景</button><p id="background-status" role="status">尚未加载全局背景</p></section>
</main><script src="background.js"></script><script src="ui_shell.js"></script></body></html>
