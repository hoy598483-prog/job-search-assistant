<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学习笔记本</title><link rel="stylesheet" href="design.css"><link rel="stylesheet" href="learning.css"><body><main>
<h1>学习笔记本</h1><p>按学习日期整理知识点、已完成任务和计划。数据仅保存在此浏览器；不需要连接Codex。删除扩展会清除本地数据，可先导出备份。</p>
<section><h2>记录学习</h2><label>日期<input id="note-date" type="date"></label><label>准备方向<select id="note-direction"></select></label><label>类型<select id="note-kind"><option value="knowledge">知识点 / 学习心得</option><option value="task">已完成任务</option><option value="plan">本人确认已完成的计划</option></select></label><label>标题<input id="note-title" maxlength="200"></label><label>内容<textarea id="note-content" maxlength="20000" placeholder="学到了什么、例子、成果、卡点和下一步"></textarea></label><button id="note-save">保存笔记</button><button id="note-reset">新建一条</button></section>
<section><h2>按日期回顾</h2><label>方向<select id="filter-direction"></select></label><label>日期<input id="filter-date" type="date"></label><label>搜索<input id="filter-search" placeholder="标题或内容"></label><button id="note-refresh">刷新</button><button id="note-export">导出当前筛选结果为Markdown</button><p id="note-status" role="status"></p><div id="note-list"></div></section>
<script src="notebook_store.js"></script><script src="notebook.js"></script></main><script src="ui_shell.js"></script><script src="qa_store.js"></script><script src="selection_host.js"></script></body></html>
