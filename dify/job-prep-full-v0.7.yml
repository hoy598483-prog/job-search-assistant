          "data": {
            "type": "llm",
            "title": "求职准备教练",
            "desc": "在一段持续对话中收集信息、生成项目与计划、评审提交。",
            "model": {
              "provider": "langgenius/openai/openai",
              "name": "gpt-4o-mini",
