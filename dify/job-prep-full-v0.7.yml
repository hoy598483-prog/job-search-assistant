          "data": {
            "type": "code",
            "title": "校验并更新计划状态",
            "desc": "",
            "code_language": "python3",
            "code": "import copy\nimport json\nimport re\n\n\ndef _clean_json(raw):\n    if isinstance(raw, dict):\n        return raw\n    text = (raw or \"\").strip()\n    text = re.sub(r\"^```(?:json)?\\s*|\\s*```$\", \"\", text).strip()\n    return json.loads(text)\n\n\ndef _day_text(plan, day_number):\n    days = plan.get(\"days\", [])\n    day = next((item for item in days if item.get(\"day\") == day_number), None)\n    if not day:\n        return \"当前计划中找不到对应日期，请重新生成计划。\"\n    return (f\"第 {day_number} 天：{day['goal']}\\n\"\n            f\"任务：{day['tasks']}\\n\"\n            f\"预计：{day['estimated_minutes']} 分钟\\n\"\n            f\"交付物：{day['deliverable']}\\n\"\n            f\"验收方法：{day['acceptance']}\")\n\n\ndef _valid_plan(plan, budget):\n    if not isinstance(plan, dict):\n        return False\n    days = plan.get(\"days\", [])\n    if not isinstance(days, list) or len(days) != 7:\n        return False\n    if [item.get(\"day\") for item in days] != list(range(1, 8)):\n        return False\n    required = (\"goal\", \"tasks\", \"deliverable\", \"acceptance\")\n    for day in days:\n        if any(not isinstance(day.get(k), str) or not day[k].strip() for k in required):\n            return False\n        try:\n            minutes = int(day.get(\"estimated_minutes\", 0))\n        except (TypeError, ValueError):\n            return False\n        if not 1 <= minutes <= budget:\n            return False\n    return True\n\n\ndef main(raw: str, prior_state: dict, user_query: str) -> dict:\n    state = copy.deepcopy(prior_state) if isinstance(prior_state, dict) else {}\n    state.setdefault(\"profile\", {})\n    state.setdefault(\"project_options\", [])\n    state.setdefault(\"selected_project\", \"\")\n    state.setdefault(\"plan\", {})\n    state.setdefault(\"status\", \"collecting\")\n\n    try:\n        proposal = _clean_json(raw)\n        if not isinstance(proposal, dict):\n            raise ValueError(\"LLM output is not an object\")\n    except (json.JSONDecodeError, ValueError, TypeError):\n        return {\"state\": state, \"reply\": \"我没有正确处理这条信息，请再发一次。已有资料和计划仍保留。\"}\n\n    updates = proposal.get(\"profile_updates\") or {}\n    if isinstance(updates, dict):\n        for key in (\"role_group\", \"background\", \"daily_minutes\", \"city\"):\n            value = updates.get(key)\n            if isinstance(value, str) and value.strip():\n                state[\"profile\"][key] = value.strip()\n        new_jd = updates.get(\"job_briefs\")\n        if isinstance(new_jd, str) and new_jd.strip():\n            old_jd = state[\"profile\"].get(\"job_briefs\", \"\")\n            if new_jd.strip() not in old_jd:\n                state[\"profile\"][\"job_briefs\"] = old_jd + \"\\n\\n--- JD ---\\n\\n\" + new_jd.strip() if old_jd else new_jd.strip()\n\n    action = proposal.get(\"action\", \"other\")\n    reply = proposal.get(\"reply\", \"\")\n    if not isinstance(reply, str):\n        reply = \"\"\n\n    if action == \"collect\":\n        state[\"status\"] = \"collecting\" if not state.get(\"plan\") else state[\"status\"]\n        return {\"state\": state, \"reply\": reply or \"请补充目标岗位、招聘要求、个人背景和每天可投入的时间。\"}\n\n    if action == \"analyze\":\n        options = proposal.get(\"project_options\")\n        if isinstance(options, list) and 2 <= len(options) <= 3:\n            state[\"project_options\"] = [item for item in options if isinstance(item, dict)]\n        if not state.get(\"plan\"):\n            state[\"status\"] = \"choosing_project\"\n        return {\"state\": state, \"reply\": reply or \"请从项目选项中选择一个。\"}\n\n    if action == \"create_plan\":\n        choice = proposal.get(\"selected_project\") or state.get(\"selected_project\", \"\")\n        if isinstance(choice, str) and choice.strip():\n            state[\"selected_project\"] = choice.strip()\n        try:\n            budget = int(state[\"profile\"].get(\"daily_minutes\", \"0\"))\n        except (TypeError, ValueError):\n            budget = 0\n        plan = proposal.get(\"plan\")\n        if budget < 1 or not _valid_plan(plan, budget):\n            return {\"state\": state, \"reply\": \"计划格式或每日时间有误，请再说一次你选择的项目和每天可投入的分钟数。\"}\n        plan = copy.deepcopy(plan)\n        plan[\"project\"] = state[\"selected_project\"] or plan.get(\"project\", \"\")\n        plan[\"daily_budget_minutes\"] = budget\n        plan[\"current_day\"] = 1\n        for day in plan[\"days\"]:\n            day[\"status\"] = \"not_started\"\n            day[\"review\"] = \"\"\n        state[\"plan\"] = plan\n        state[\"status\"] = \"active\"\n        return {\"state\": state, \"reply\": \"已保存七天计划。\\n\\n\" + _day_text(plan, 1) + \"\\n\\n完成后请提交交付物或可检查的内容。\"}\n\n    if action == \"show_today\":\n        plan = state.get(\"plan\") or {}\n        if not plan.get(\"days\"):\n            return {\"state\": state, \"reply\": \"还没有保存训练计划。请先选择一个项目。\"}\n        if state.get(\"status\") == \"completed\":\n            return {\"state\": state, \"reply\": \"七天计划已完成。你可以提交最终作品，我会帮你复盘。\"}\n        day_number = int(plan.get(\"current_day\", 1))\n        return {\"state\": state, \"reply\": _day_text(plan, day_number)}\n\n    if action == \"review\":\n        plan = state.get(\"plan\") or {}\n        if not plan.get(\"days\"):\n            return {\"state\": state, \"reply\": \"还没有保存训练计划。请先选择一个项目。\"}\n        day_number = int(plan.get(\"current_day\", 1))\n        if not 1 <= day_number <= 7:\n            return {\"state\": state, \"reply\": \"计划日期无效，请重新生成计划。\"}\n        review = proposal.get(\"review\") or {}\n        if not isinstance(review, dict):\n            review = {}\n        feedback = str(review.get(\"feedback\") or \"请补充可检查的成果。\")\n        evidence = str(review.get(\"evidence\") or \"\").strip()\n        passed = (review.get(\"status\") == \"passed\" and len(evidence) >= 8\n                  and evidence in user_query and len(user_query.strip()) > 12)\n        today = plan[\"days\"][day_number - 1]\n        today[\"review\"] = feedback\n        if passed:\n            today[\"status\"] = \"passed\"\n            if day_number == 7:\n                state[\"status\"] = \"completed\"\n                return {\"state\": state, \"reply\": \"第 7 天已通过。\" + feedback + \"\\n七天计划完成，请整理最终作品用于投递。\"}\n            plan[\"current_day\"] = day_number + 1\n            return {\"state\": state, \"reply\": \"第 \" + str(day_number) + \" 天通过。\" + feedback + \"\\n\\n\" + _day_text(plan, day_number + 1)}\n        today[\"status\"] = \"revise\"\n        revision = str(review.get(\"revision_task\") or \"请提交能按验收标准检查的交付物。\")\n        return {\"state\": state, \"reply\": \"第 \" + str(day_number) + \" 天仍需修改。\" + feedback + \"\\n修改动作：\" + revision}\n\n    return {\"state\": state, \"reply\": reply or \"请告诉我你想分析的岗位、选择的项目，或提交今天的成果。\"}\n",
            "variables": [
